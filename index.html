<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#0d294e">

<style>
:root{--bg:#f5f6f8;--sf:#fff;--ink:#0d294e;--tx:#172033;--mu:#5d6779;--ac:#fc9e28;--acd:#c97a10;--bd:#e0e3e9;--ok:#13804a;--er:#b93a2b;--lg:#0d294e;--sh:0 1px 2px #0d294e14,0 4px 14px #0d294e0d}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1220;--sf:#111b2e;--ink:#070d18;--tx:#e7ecf5;--mu:#9aa7bd;--bd:#223049;--lg:#a9c0ea;--sh:none}}
:root[data-theme="dark"]{--bg:#0a1220;--sf:#111b2e;--ink:#070d18;--tx:#e7ecf5;--mu:#9aa7bd;--bd:#223049;--lg:#a9c0ea;--sh:none}
*{box-sizing:border-box}html{padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
a{color:inherit}h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em}
.w{max-width:1120px;margin:0 auto;padding:0 16px}
header{background:var(--ink);position:sticky;top:0;z-index:20;box-shadow:0 1px 0 #ffffff14}
.hd{display:flex;align-items:center;gap:12px;padding:10px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:#fff}.logo svg{height:34px;width:auto;--lg:#fff}.logo b{font-size:22px;letter-spacing:-.03em}
.sb{flex:1 1 260px;display:flex;order:3;min-width:0}@media(min-width:760px){.sb{order:0}}
.sb input{flex:1;min-width:0;border:0;border-radius:8px 0 0 8px;padding:11px 14px;background:#fff;color:#172033;font:inherit}
.sb button{border-radius:0 8px 8px 0}
.nv{display:flex;gap:6px;margin-left:auto}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:10px 15px;border-radius:8px;text-decoration:none;display:inline-block;font-weight:500}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.pr{background:var(--ac);border-color:var(--ac);color:#1b1204;font-weight:700}.pr:hover{background:#ffae45}
.nv button,.nv .btn{background:transparent;color:#fff;border-color:#ffffff33;padding:8px 12px}
.hero{background:var(--sf);border-bottom:1px solid var(--bd);padding:34px 0}
.hero h1{font-size:clamp(30px,6.4vw,52px);color:var(--lg)}.hero h1 em{font-style:normal;color:var(--acd)}
.hero p{color:var(--mu);max-width:560px;margin:12px 0 18px;font-size:17px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-top:20px}
.cat{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 4px;text-align:center;font-size:12px;font-weight:600;line-height:1.2}.cat span{display:block;font-size:18px;margin-bottom:2px}
#ins{background:transparent;color:#fff;border-color:#ffffff33;margin-left:auto}
.bn{display:flex;gap:4px}.bn a{display:flex;align-items:center;gap:6px;color:#fff;text-decoration:none;padding:8px 10px;border-radius:8px;font-size:14px}.bn a:hover,.bn a.on{background:#ffffff1f}.bn a.on{color:var(--ac)}
@media(max-width:759px){.bn{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--sf);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:0}.bn a{flex:1;flex-direction:column;gap:2px;font-size:11px;color:var(--mu);padding:4px 0}.bn a:hover{background:none}.bn a.on{color:var(--acd);font-weight:700}footer{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}#ts{bottom:calc(86px + env(safe-area-inset-bottom,0px))}}
@media(min-width:760px){#ins{margin-left:0}.chat{height:calc(100dvh - 190px)}}
.chat{display:flex;flex-direction:column;height:calc(100dvh - 250px);min-height:360px;margin-top:12px}
.ch{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--sf);border:1px solid var(--bd);border-radius:10px 10px 0 0}.ch a{text-decoration:none;font-size:20px}
.ml{flex:1;overflow:auto;padding:12px;background:var(--bg);border:1px solid var(--bd);border-top:0;border-bottom:0;display:flex;flex-direction:column;gap:8px}
.mb{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--sf);border:1px solid var(--bd);align-self:flex-start;white-space:pre-wrap;word-break:break-word}.mb.me{align-self:flex-end;background:var(--ac);color:#1b1204;border-color:var(--ac)}.mb span{display:block;font-size:10px;opacity:.65;margin-top:2px}
.mf{display:flex;gap:8px;padding:10px;background:var(--sf);border:1px solid var(--bd);border-radius:0 0 10px 10px}
.chip{padding:6px 14px;border-radius:20px;font-size:13px}
.bn a{position:relative}.bdg{position:absolute;top:2px;left:26px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--er);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:700;font-style:normal}.bdg[hidden]{display:none}
.msb{margin-top:10px;border-radius:24px;padding:12px 16px}.mtabs{display:flex;gap:4px;margin:10px 0;overflow-x:auto;border-bottom:1px solid var(--bd)}
.mt{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 14px;white-space:nowrap;color:var(--mu);font-weight:600}.mt.on{color:var(--acd);border-color:var(--ac)}
.mt .bdg{position:static;display:inline-block;margin-left:6px}.strong{color:var(--tx)!important;font-weight:700}
.rf{display:block;font-size:12px;opacity:.85;text-decoration:underline;margin-bottom:4px;color:inherit}
.pcnt{position:absolute;top:8px;right:8px;z-index:1;background:#000a;color:#fff;border-radius:12px;padding:3px 9px 3px 7px;font-size:12px;font-weight:600;display:flex;gap:4px;align-items:center}.pcnt svg{width:14px;height:14px}
.gal{position:relative;border-radius:10px;overflow:hidden;background:var(--tile)}.gs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.gs::-webkit-scrollbar{display:none}
.gs img{flex:0 0 100%;width:100%;aspect-ratio:1;object-fit:cover;scroll-snap-align:center;display:block}.gal .pcnt{top:10px;right:10px}
.gn{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:26px;line-height:1;padding:0;display:none}.gp{left:8px}.gx{right:8px}@media(hover:hover){.gn{display:block}}
.gd{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:6px;justify-content:center}.gd i{width:8px;height:8px;border-radius:50%;background:#fff9;cursor:pointer}.gd i.on{background:#fff;width:20px;border-radius:4px}
.phs{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-bottom:8px}.th{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:2px solid var(--bd)}.th.cover{border-color:var(--ac)}.th img{width:100%;height:100%;object-fit:cover;cursor:pointer;display:block}
.th button{position:absolute;top:2px;right:2px;width:22px;height:22px;padding:0;border-radius:50%;background:#000b;color:#fff;border:0;line-height:1}.th span{position:absolute;bottom:0;left:0;right:0;background:var(--ac);color:#1b1204;font-size:10px;font-weight:700;text-align:center}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:0}main{flex:1 0 auto;width:100%}footer{margin-top:44px}
.pw{position:relative}.pw input{padding-right:48px}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;padding:8px;color:var(--mu);display:grid;place-items:center;cursor:pointer}
.cv{text-decoration:none;color:inherit;flex-wrap:nowrap;gap:14px;padding:14px 0}.cvav{width:56px;height:56px;font-size:22px}.cvm{flex:1;min-width:0}.cvn{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cvp{color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.cvr{display:flex;flex-direction:column;align-items:flex-end;gap:6px;align-self:flex-start;padding-top:2px}
.cvt{font-size:12px;color:var(--mu);white-space:nowrap}.cvt.on{color:var(--acd);font-weight:700}
.cvb{min-width:24px;height:24px;border-radius:12px;padding:0 7px;background:var(--ac);color:#1b1204;font-size:13px;line-height:24px;text-align:center;font-weight:700}
.tk{font-style:normal;font-size:11px;opacity:.7}.tk.seen{color:#2b8cff;opacity:1;font-weight:700}.mb.me .tk.seen{color:#0b3d91}
.bdg{background:#f4511e!important;color:#fff}.bn .bdg{min-width:20px;height:20px;line-height:20px;border-radius:10px;font-size:12px;box-shadow:0 0 0 2px var(--sf);left:24px;top:0}
@media(min-width:760px){.bn .bdg{box-shadow:0 0 0 2px var(--ink)}}
@media(max-width:759px){.bn .bdg{left:calc(50% + 2px);top:-2px}}
@media(max-width:759px){.bdg{left:calc(50% + 4px);top:0}}.sel{background:var(--ac)!important;color:#1b1204!important;border-color:var(--ac)!important}
.sec{margin:34px 0 12px;display:flex;justify-content:space-between;align-items:baseline}.sec h2{font-size:22px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:760px){.g{grid-template-columns:repeat(4,1fr)}}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:10px;overflow:hidden;box-shadow:var(--sh)}
.cd .im{aspect-ratio:4/3;background:linear-gradient(135deg,#0d294e12,#fc9e2822);display:grid;place-items:center;font-size:12px;color:var(--mu)}.cd .im{position:relative;overflow:hidden}.cd .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cb{padding:11px}.pz{font-weight:800}.mu{color:var(--mu);font-size:13px}
.pan{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;box-shadow:var(--sh);margin-top:16px}
.empty{border:1px dashed var(--bd);border-radius:12px;padding:26px;text-align:center;color:var(--mu);grid-column:1/-1;background:var(--sf)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.fg{display:grid;gap:0 14px}@media(min-width:700px){.fg{grid-template-columns:1fr 1fr}}
.tags span{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid var(--bd);margin:2px 4px 2px 0}
.ok{color:var(--ok);border-color:var(--ok)!important}.wn{color:var(--acd)}
#md{position:fixed;inset:0;background:#050a14aa;z-index:40;display:none;align-items:center;justify-content:center;padding:16px}#md.on{display:flex}
#md .pan{width:100%;max-width:400px;margin:0;max-height:90vh;overflow:auto}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0));background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;z-index:60;display:none;max-width:92%}
.err{color:var(--er);font-size:13px;min-height:18px;margin-top:8px}
footer{margin-top:44px;border-top:1px solid var(--bd);background:var(--sf)}
.ft{padding:22px 16px}.ft svg{height:26px}
.cbm{font-size:12px;color:var(--mu);margin-top:14px;padding-top:12px;border-top:1px solid var(--bd)}.cbm a{margin-left:10px}
.cbm i{font-style:normal;font-weight:800;border:1px solid var(--mu);border-radius:3px;padding:0 5px;margin:0 4px}
@media(display-mode:standalone){.cbm{display:none}}.pwa .cbm{display:none}
.ib{width:42px;height:42px;padding:0!important;display:inline-grid!important;place-items:center}.ib[hidden]{display:none!important}.nv{gap:4px}
.sd{display:grid;gap:16px;margin-top:14px}@media(min-width:760px){.sd{grid-template-columns:240px 1fr}}
#fl{position:fixed;inset:0;z-index:30;background:var(--bg);padding:16px;overflow:auto;display:none}#fl.open{display:block}
@media(min-width:760px){#fl{position:static;display:block;padding:0;background:none;z-index:auto}.fo{display:none}}
.two{display:grid;gap:18px;margin-top:12px}@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
.rw{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--bd)}.rt{flex:1 1 200px}.rb{display:flex;gap:6px}.rb button{padding:6px 10px;font-size:13px}
.av{width:76px;height:76px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:700;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}
a.cd{display:block;text-decoration:none;color:inherit}.nm{font-weight:500}.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid var(--bd)}
button:disabled{opacity:.6;cursor:wait}

.logo{flex:none;padding:2px 0;min-width:0}.logo svg{flex:none;overflow:visible}.hd{padding-left:max(0px,env(safe-area-inset-left));padding-right:max(0px,env(safe-area-inset-right))}
.sb input{padding:13px 14px;font-size:16px}.sb button{padding:12px 18px}
.hero.compact{padding:16px 0 14px}.hero.compact h1{font-size:clamp(26px,7vw,40px)}.hero.compact p{margin:8px 0 12px;font-size:15px}.acts{flex-wrap:nowrap;gap:8px}.acts .btn{flex:1 1 0;min-width:0;text-align:center;padding:10px 6px;font-size:14px;line-height:1.25}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:68px;overflow-wrap:anywhere;text-decoration:none;color:inherit}
.seg{display:flex;gap:4px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-top:16px}.seg a{flex:1;text-align:center;padding:10px 6px;border-radius:9px;text-decoration:none;font-weight:600;color:var(--mu)}.seg a.on{background:var(--ac);color:#1b1204}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips button{flex:none;border-radius:20px;padding:7px 14px;font-size:13px;white-space:nowrap}
.ck{display:flex;gap:8px;align-items:center;color:var(--tx);margin-top:12px}.ck input{width:auto}
.li{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 2px;border:0;border-top:1px solid var(--bd);border-radius:0;background:none;color:var(--tx);text-decoration:none;text-align:left;cursor:pointer;font:inherit}.li.soon{color:var(--mu);cursor:default}.li i{font-style:normal;font-size:11px;border:1px solid var(--bd);border-radius:10px;padding:1px 8px}.li b{color:var(--mu)}.lt{padding:12px 2px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu)}
.mf textarea{flex:1;resize:none;max-height:140px;min-width:0}
.er{color:var(--er);border-color:var(--er)!important}.ord{display:block;text-decoration:none;color:inherit;margin-top:10px}
